<!DOCTYPE HTML>
<html>

<head>
	<title>Francesco Casillo</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link href="images/android-chrome-192x192.png" rel="icon" />
	<link href="images/apple-touch-icon.png" rel="apple-touch-icon" />
	
	<noscript>
		<link rel="stylesheet" href="assets/css/noscript.css" />
	</noscript>
	<style>
		body {
			height: 100vh;
			display: flex;
			width: 100%;
			align-items: center;
			justify-content: center;
			background: linear-gradient(45deg, #310101 0%, #000000 100%);
			font-family: 'Courier New', monospace;
			font-size: 1.5em;
			color: white;
		}

		#output {
			text-align: center;
			line-height: 1.6;
			/* Spazio tra righe */
			max-width: 80%;
			padding: 2rem;
		}

		.blink {
			animation: blink 1s infinite;
		}

		@keyframes blink {
			50% {
				opacity: 0;
			}
		}
	</style>
</head>

<body class="is-preload">


	<div id="output"></div>
	<script>
		const texts = ["HOW YOU COME HERE?", "WHAT YOU WERE SEARCHING FOR IS NO LONGER AVAILABLE!", "RECALIBRATING THE SYSTEM, PLEASE TRY AGAIN SOON"];
		let allText = "";
		let currentText = 0;
		let letter = 0;

		function writeLetter() {
			if (letter < texts[currentText].length) {
				if (letter === 0 && currentText > 0) allText += "<br><BR>";  // ← A CAPO QUI

				allText += texts[currentText][letter];
				document.getElementById("output").innerHTML = allText + "<span class='blink'>|</span>";
				letter++;
				setTimeout(writeLetter, 150);
			} else {
				letter = 0;
				currentText++;
				if (currentText < texts.length) {
					setTimeout(writeLetter, 1000);
				} else {
					// Dots finali
					const dots = document.getElementById("output");
					dots.innerHTML = allText + "<br><br><span id='dots' class='blink'>...</span>";
					let d = 0;
					const states = [".|", "..|", "...|"];
					setInterval(() => {
						document.getElementById("dots").textContent = states[d];
						d = (d + 1) % 3;
					}, 400);
				}
			}
		}
		setTimeout(writeLetter, 500);
	</script>
</body>

</html>
